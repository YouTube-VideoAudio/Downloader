name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', 'capacitor.config.json', '.github/workflows/apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - run: npx cap add android
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: |
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 native/icon-only.svg -o assets/icon-only.png
          rsvg-convert -w 1024 -h 1024 native/icon-foreground.svg -o assets/icon-foreground.png
          rsvg-convert -w 1024 -h 1024 native/icon-background.svg -o assets/icon-background.png
      - run: npm install -D @capacitor/assets
      - run: npx @capacitor/assets generate --android
      - run: bash native/patch.sh
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
