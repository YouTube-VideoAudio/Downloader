name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', 'capacitor.config.json', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_FILE: ${{ github.workspace }}/release.keystore
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - run: npx cap add android
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: |
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 native/icon-only.svg -o assets/icon-only.png
          rsvg-convert -w 1024 -h 1024 native/icon-foreground.svg -o assets/icon-foreground.png
          rsvg-convert -w 1024 -h 1024 native/icon-background.svg -o assets/icon-background.png
      - run: npm install -D @capacitor/assets
      - run: npx @capacitor/assets generate --android
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$KS_FILE"; fi
      - run: bash native/patch.sh
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "Video Downloader.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader
          path: Video Downloader.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "Video Downloader.apk" Video-Downloader.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Video Downloader" --notes "Latest build" --latest
          gh release delete-asset latest VideoDownloader.apk -y || true
          gh release upload latest Video-Downloader.apk --clobber
