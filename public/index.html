<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Video Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #e5e7eb;
      color: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 14px 40px;
    }
    .app-shell {
      width: 100%;
      max-width: 440px;
      background: #f3f4f6;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      border: 1px solid #d1d5db;
    }
    .topbar {
      background: #ffffff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.3px;
    }
    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: #dc2626;
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 12px;
    }
    .lang-pill {
      font-size: 11px;
      font-weight: 700;
      color: #374151;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .hero-card {
      margin: 14px;
      background: #e9ebee;
      border-radius: 22px;
      padding: 24px 18px 20px;
      text-align: center;
      position: relative;
    }
    .wave {
      color: #ef4444;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -2px;
      margin-bottom: 6px;
      display: block;
    }
    .hero-title-light {
      font-size: 20px;
      font-weight: 400;
      color: #374151;
      line-height: 1.15;
    }
    .hero-title-bold {
      font-size: 32px;
      font-weight: 900;
      color: #111827;
      letter-spacing: -0.8px;
      line-height: 1.05;
      margin-bottom: 12px;
    }
    .hero-desc {
      font-size: 12px;
      line-height: 1.5;
      color: #4b5563;
      max-width: 310px;
      margin: 0 auto 14px;
    }
    .red-rule {
      width: 28px;
      height: 2px;
      background: #ef4444;
      margin: 0 auto 16px;
      border-radius: 2px;
    }
    .input-pill {
      background: #ffffff;
      border-radius: 999px;
      padding: 6px 6px 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #e5e7eb;
    }
    .input-pill:focus-within {
      border-color: #dc2626;
    }
    .link-icon {
      color: #6b7280;
      font-size: 13px;
      user-select: none;
    }
    .input-pill input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      font-size: 13px;
      color: #111827;
      outline: none;
    }
    .btn-primary {
      background: #dc2626;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary:hover {
      background: #b91c1c;
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Dynamic selectors appear only after fetching */
    .fetched-panel {
      display: none;
      margin-top: 14px;
      background: #ffffff;
      border-radius: 16px;
      padding: 14px;
      text-align: left;
      border: 1px solid #e5e7eb;
    }
    .fetched-panel.visible {
      display: block;
    }
    .media-meta {
      font-size: 12px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 10px;
      word-break: break-word;
    }
    .selector-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .selector-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .sel-btn {
      border: 1px solid #d1d5db;
      background: #f9fafb;
      color: #111827;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .sel-btn.active {
      background: #dc2626;
      border-color: #dc2626;
      color: #ffffff;
    }
    .btn-confirm {
      width: 100%;
      background: #18181b;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-confirm:hover {
      background: #27272a;
    }

    .dark-strip {
      background: #18181b;
      color: #f9fafb;
      margin: 0 14px 14px;
      border-radius: 18px;
      padding: 16px 18px;
    }
    .dark-strip-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-note {
      margin-top: 8px;
      font-size: 11px;
      color: #d4d4d8;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">▶</span>
        <span>Downloader</span>
      </div>
      <button type="button" class="lang-pill" id="langBtn">ENG ▾</button>
    </header>

    <section class="hero-card">
      <span class="wave">~~~</span>
      <div class="hero-title-light" id="subTitle">Online Video</div>
      <h1 class="hero-title-bold" id="mainTitle">Downloader</h1>
      <p class="hero-desc" id="descText">
        Paste a link first to check available qualities and formats before downloading.
      </p>
      <div class="red-rule"></div>

      <div class="input-pill">
        <span class="link-icon">🔗</span>
        <input type="url" id="urlInput" placeholder="Insert Video Link Here..." autocomplete="off" />
        <button type="button" class="btn-primary" id="fetchBtn">Download</button>
      </div>

      <div class="fetched-panel" id="fetchedPanel">
        <div class="media-meta" id="mediaTitle">Media title will appear here</div>
        <div class="selector-label">Available Selectors</div>
        <div class="selector-grid" id="selectorGrid"></div>
        <button type="button" class="btn-confirm" id="startDownloadBtn">Save Selected Format</button>
      </div>
    </section>

    <section class="dark-strip">
      <div class="dark-strip-top">
        <span>Supported Platforms:</span>
        <span>YouTube • Audio/Video</span>
      </div>
      <p class="status-note" id="statusText">
        Selectors are hidden until available formats are fetched.
      </p>
    </section>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const fetchBtn = document.getElementById('fetchBtn');
    const fetchedPanel = document.getElementById('fetchedPanel');
    const mediaTitle = document.getElementById('mediaTitle');
    const selectorGrid = document.getElementById('selectorGrid');
    const startDownloadBtn = document.getElementById('startDownloadBtn');
    const statusText = document.getElementById('statusText');
    const langBtn = document.getElementById('langBtn');

    let availableFormats = [];
    let chosenFormat = null;
    let isBangla = false;

    langBtn.addEventListener('click', () => {
      isBangla = !isBangla;
      langBtn.textContent = isBangla ? 'BAN ▾' : 'ENG ▾';
      document.getElementById('subTitle').textContent = isBangla ? 'অনলাইন ভিডিও' : 'Online Video';
      document.getElementById('mainTitle').textContent = isBangla ? 'ডাউনলোডার' : 'Downloader';
      document.getElementById('descText').textContent = isBangla
        ? 'লিংক দেওয়ার পর যে ফরম্যাট ও কোয়ালিটিগুলো পাওয়া যাবে, শুধু সেগুলোই এখানে আসবে।'
        : 'Paste a link first to check available qualities and formats before downloading.';
      urlInput.placeholder = isBangla ? 'এখানে ভিডিও লিংক দিন...' : 'Insert Video Link Here...';
      fetchBtn.textContent = isBangla ? 'চেক করুন' : 'Download';
    });

    // Replace this mock fetcher with your backend endpoint (e.g., /api/formats?url=...)
    async function fetchAvailableFormats(targetUrl) {
      await new Promise((r) => setTimeout(r, 450));
      return {
        title: `Fetched Stream (${new URL(targetUrl).hostname})`,
        formats: [
          { id: '720p-mp4', label: '720p MP4' },
          { id: '480p-mp4', label: '480p MP4' },
          { id: '128k-mp3', label: '128kbps MP3' }
        ]
      };
    }

    function renderSelectors(formats) {
      selectorGrid.innerHTML = '';
      chosenFormat = formats.length ? formats[0].id : null;

      formats.forEach((fmt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `sel-btn${idx === 0 ? ' active' : ''}`;
        btn.textContent = fmt.label;
        btn.dataset.id = fmt.id;

        btn.addEventListener('click', () => {
          document.querySelectorAll('.sel-btn').forEach((el) => el.classList.remove('active'));
          btn.classList.add('active');
          chosenFormat = fmt.id;
          statusText.textContent = `Selected available option: ${fmt.label}`;
        });

        selectorGrid.appendChild(btn);
      });
    }

    fetchBtn.addEventListener('click', async () => {
      const raw = urlInput.value.trim();
      if (!raw) {
        statusText.textContent = 'Please paste a link first.';
        urlInput.focus();
        return;
      }

      try {
        new URL(raw);
      } catch {
        statusText.textContent = 'Invalid URL. Please enter a valid link.';
        urlInput.focus();
        return;
      }

      fetchBtn.disabled = true;
      statusText.textContent = 'Fetching available formats...';
      fetchedPanel.classList.remove('visible');

      try {
        const data = await fetchAvailableFormats(raw);
        availableFormats = data.formats || [];

        if (!availableFormats.length) {
          statusText.textContent = 'No available formats found for this link.';
          return;
        }

        mediaTitle.textContent = data.title || 'Available Media';
        renderSelectors(availableFormats);
        fetchedPanel.classList.add('visible');
        statusText.textContent = `Found ${availableFormats.length} available options. Choose one above.`;
      } catch (err) {
        statusText.textContent = 'Could not fetch formats. Check backend connection.';
      } finally {
        fetchBtn.disabled = false;
      }
    });

    startDownloadBtn.addEventListener('click', () => {
      if (!chosenFormat) {
        statusText.textContent = 'No format selected.';
        return;
      }
      statusText.textContent = `Ready to process format "${chosenFormat}" via backend.`;
    });
  </script>
</body>
</html>
